# Run both containers locally: `docker compose up --build`.
# Reads secrets from .env.local (never committed). Same images AWS runs.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.local
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file: .env.local
    environment:
      DEMO_URL: http://localhost:3000
    read_only: true
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
